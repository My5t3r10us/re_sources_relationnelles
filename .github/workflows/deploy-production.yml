name: Déploiement production

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement Dokploy production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Vérifier la configuration Dokploy
        id: dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Le secret DOKPLOY_WEBHOOK_URL n'est pas configuré ; déploiement ignoré."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déclencher le webhook Dokploy de production
        if: steps.dokploy.outputs.configured == 'true'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          curl --fail-with-body -sS -X POST \
               --retry 3 --retry-delay 5 --retry-all-errors \
               --max-time 60 \
               -H "Content-Type: application/json" \
               -H "X-GitHub-Event: push" \
               --data "{\"ref\":\"refs/heads/master\",\"repository\":{\"full_name\":\"${GITHUB_REPOSITORY}\"}}" \
               "$DOKPLOY_WEBHOOK_URL"

      - name: Résumé
        if: steps.dokploy.outputs.configured == 'true'
        run: |
          {
            echo "### Déploiement de production déclenché"
            echo
            echo "- Commit : \`${GITHUB_SHA::7}\`"
            echo "- Webhook Dokploy appelé avec succès."
            echo
            echo "> Aucun contrôle CI n'est relancé sur master : le commit a"
            echo "> déjà été validé sur dev puis staging."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Résumé de configuration
        if: steps.dokploy.outputs.configured != 'true'
        run: |
          {
            echo "### Déploiement de production non déclenché"
            echo
            echo "Le secret environnemental \`DOKPLOY_WEBHOOK_URL\` doit être configuré."
          } >> "$GITHUB_STEP_SUMMARY"

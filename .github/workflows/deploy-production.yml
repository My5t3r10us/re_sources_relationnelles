name: Déploiement production

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement Dokploy production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Déclencher le webhook Dokploy de production
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::Le secret DOKPLOY_WEBHOOK_URL n'est pas configuré."
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
               --retry 3 --retry-delay 5 --retry-all-errors \
               --max-time 60 \
               "$DOKPLOY_WEBHOOK_URL"

      - name: Résumé
        run: |
          {
            echo "### Déploiement de production déclenché"
            echo
            echo "- Commit : \`${GITHUB_SHA::7}\`"
            echo "- Webhook Dokploy appelé avec succès."
            echo
            echo "> Aucun contrôle CI n'est relancé sur master : le commit a"
            echo "> déjà été validé sur dev puis staging."
          } >> "$GITHUB_STEP_SUMMARY"
